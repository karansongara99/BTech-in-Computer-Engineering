<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Prediction Result</h1>

      <div class="card">
        <div class="card-body">
          <h3>Outcome: <span class="badge bg-{{ 'danger' if prediction==1 else 'success' }}">{{ label }}</span></h3>
          {% if probability is not none %}
            <p class="mt-3"><strong>Confidence:</strong> {{ (probability*100)|round(2) }}%</p>
          {% endif %}

          <h5 class="mt-4">Inputs used:</h5>
          <ul>
            {% for k,v in inputs.items() %}
              <li><strong>{{ k }}:</strong> {{ v }}</li>
            {% endfor %}
          </ul>

          <a href="/" class="btn btn-primary mt-3">Make another prediction</a>
        </div>
      </div>
    </div>
  </body>
</html>
